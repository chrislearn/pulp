name: Compatible security backport

on:
  push:
    branches: [fix/0.22-maintained-paste-and-simd-20261116]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - run: cargo test -p pulp --lib -- --nocapture
      - run: cargo test -p pulp --lib --no-default-features -- --nocapture
      - run: cargo check -p pulp --features macro
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.84.0
      - run: cargo check -p pulp --lib
      - run: cargo check -p pulp --lib --no-default-features
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - run: cargo check -p pulp --target wasm32-unknown-unknown
      - run: cargo check -p pulp --target wasm32-unknown-unknown --no-default-features --features std,x86-v3
  aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: aarch64-unknown-linux-gnu
      - run: cargo check -p pulp --lib --target aarch64-unknown-linux-gnu --no-default-features
        env:
          RUSTFLAGS: -Dwarnings
      - run: cargo check -p pulp --lib --target aarch64-unknown-linux-gnu --no-default-features
        env:
          RUSTFLAGS: -Dwarnings -Ctarget-feature=+aes,+neon
